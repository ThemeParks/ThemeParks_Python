name: Mutation

# NIGHTLY AND NON-GATING, deliberately. It re-runs the whole suite once per
# mutant, which is minutes rather than the seconds a commit gate can spend, and a
# survivor is information rather than a reason to block a merge.
#
# The mutants are committed (tests/mutation/mutants.json) rather than generated.
# A list written by the author of the tests contains the mutations those tests
# already catch: on 2026-09-28 an author-written set scored 14/14 on this package
# while an independent 54-mutant sweep found 27 survivors, one of them the defect
# that release existed to fix. A list a reviewer can read is the part that makes
# the score mean anything.
on:
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:
  # On demand from a PR too, because the moment a mutant is worth adding is the
  # moment a defect is being fixed.
  pull_request:
    paths:
      - 'tests/mutation/**'

jobs:
  mutate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      # The suite must be green BEFORE anything is mutated, or every mutant
      # "survives" against an already-red suite and the run means nothing.
      - name: Baseline
        run: pytest -q tests/unit
      - name: Mutate
        id: mutate
        continue-on-error: true
        run: python tests/mutation/run.py | tee "$GITHUB_STEP_SUMMARY"
      - name: Say so in the log when something survived
        if: steps.mutate.outcome == 'failure'
        run: |
          echo "::warning::A mutant survived or went stale — see the job summary."
          echo "Not a failure: a survivor is a gap to close, not a merge to block."
